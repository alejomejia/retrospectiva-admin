# Local + production-shape stack. Mirror this in your VPS deploy.
# - app:    Next.js server (port 3000)
# - worker: BullMQ worker (no exposed port)
# - postgres + redis: persistent state
#
# For local dev, you can run only the infra services and use `pnpm dev` on
# the host: `docker compose up postgres redis`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retrospectiva
      POSTGRES_PASSWORD: retrospectiva
      POSTGRES_DB: retrospectiva
    # NOTE: bound to loopback only — reachable from the host (local dev) but
    # never exposed on the VPS public interface. App/worker reach it over the
    # compose network by service name, no published port required.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrospectiva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # NOTE: loopback-only, same rationale as postgres above.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://retrospectiva:retrospectiva@postgres:5432/retrospectiva
      REDIS_URL: redis://redis:6379
    # NOTE: no host port publish — Dokploy's Traefik proxy reaches this
    # container internally on port 3000 via the Domain configured in the
    # dashboard. Publishing 3000:3000 conflicts with other services on the
    # host and bypasses the proxy. The container still listens on 3000.
    expose:
      - "3000"
    # Apply pending Drizzle migrations before serving. `drizzle-kit migrate`
    # is idempotent (tracks applied migrations in __drizzle_migrations), so
    # this is safe on every boot. Single app replica → no migration race.
    # Call the binaries directly: going through `pnpm <script>` triggers
    # pnpm v11's verify-deps-before-run, which fails inside the container.
    command: ["sh", "-c", "node_modules/.bin/drizzle-kit migrate && node_modules/.bin/next start"]
    # `default` keeps Postgres/Redis reachable by service name; `dokploy-network`
    # is the shared external network Traefik runs on — required for the proxy to
    # route the configured Domain to this container.
    networks:
      - default
      - dokploy-network

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://retrospectiva:retrospectiva@postgres:5432/retrospectiva
      REDIS_URL: redis://redis:6379
    # Direct binary — see app service note on pnpm verify-deps-before-run.
    command: ["node_modules/.bin/tsx", "src/lib/queue/worker.ts"]

networks:
  # Created/owned by Dokploy; Traefik attaches to it to route domains.
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
