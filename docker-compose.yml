# Local + production-shape stack. Mirror this in your VPS deploy.
# - migrate: one-shot Drizzle migration runner (runs, then exits)
# - app:     Next.js server (port 3000)
# - worker:  BullMQ worker (no exposed port)
# - postgres + redis: persistent state
#
# Boot order is enforced via depends_on conditions:
#   postgres healthy → migrate completes → app + worker start in parallel.
# This guarantees the schema exists before anything queries it, and protects
# the worker as well as the app (an inline `migrate && start` would only gate
# the app, leaving the worker to race the migration).
#
# For local dev, you can run only the infra services and use `pnpm dev` on
# the host: `docker compose up postgres redis`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retrospectiva
      POSTGRES_PASSWORD: retrospectiva
      POSTGRES_DB: retrospectiva
    # NOTE: bound to loopback only — reachable from the host (local dev) but
    # never exposed on the VPS public interface. App/worker reach it over the
    # compose network by service name, no published port required.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrospectiva"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Grace for cold starts on a small VPS before retries are counted.
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # NOTE: loopback-only, same rationale as postgres above.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner. Applies pending Drizzle migrations, then exits
  # 0 (or 1 on failure, which blocks app/worker via service_completed_successfully).
  # src/lib/db/migrate.ts closes the connection and exits cleanly, unlike
  # `drizzle-kit migrate`. Idempotent: re-running on an up-to-date DB is a no-op.
  # Binary called directly — `pnpm <script>` triggers pnpm v11's
  # verify-deps-before-run, which fails inside the container.
  migrate:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://retrospectiva:retrospectiva@postgres:5432/retrospectiva
    command: ["node_modules/.bin/tsx", "src/lib/db/migrate.ts"]

  app:
    build:
      context: .
      args:
        # Pins the Server Action encryption key at build time so redeploys
        # don't invalidate action ids in already-loaded browsers. Value comes
        # from the compose-level .env (NOT env_file, which is runtime-only).
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://retrospectiva:retrospectiva@postgres:5432/retrospectiva
      REDIS_URL: redis://redis:6379
    # NOTE: no host port publish — Dokploy's Traefik proxy reaches this
    # container internally on port 3000 via the Domain configured in the
    # dashboard. Publishing 3000:3000 conflicts with other services on the
    # host and bypasses the proxy. The container still listens on 3000.
    expose:
      - "3000"
    # Migrations already ran in the `migrate` service; just serve.
    command: ["node_modules/.bin/next", "start"]
    # `default` keeps Postgres/Redis reachable by service name; `dokploy-network`
    # is the shared external network Traefik runs on — required for the proxy to
    # route the configured Domain to this container.
    networks:
      - default
      - dokploy-network

  worker:
    build:
      context: .
      args:
        # Same image as `app`; keep the build arg identical so both stages
        # produce the same artifact (worker doesn't serve actions, but a
        # mismatched arg would force a separate image build).
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://retrospectiva:retrospectiva@postgres:5432/retrospectiva
      REDIS_URL: redis://redis:6379
      # The worker runs under raw tsx (no Next.js bundler), so the `react-server`
      # export condition that makes `import "server-only"` a no-op is never set.
      # Without it, server-only resolves to its throwing `index.js` and the
      # worker dies importing config.ts. Set the condition so it resolves to the
      # empty module, matching how Next loads server-only in the app container.
      NODE_OPTIONS: "--conditions=react-server"
    # Direct binary — see migrate service note on pnpm verify-deps-before-run.
    command: ["node_modules/.bin/tsx", "src/lib/queue/worker.ts"]

networks:
  # Created/owned by Dokploy; Traefik attaches to it to route domains.
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
